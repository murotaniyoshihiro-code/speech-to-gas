<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voice to Google Doc</title>
    <style>
        #status { color: red; font-weight: bold; }
        #result { border: 1px solid #ccc; padding: 10px; margin-top: 10px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>音声入力 → Googleドキュメント自動転送</h1>
    <button id="start-btn">録音開始</button>
    <button id="stop-btn">停止</button>
    <p>ステータス: <span id="status">待機中</span></p>
    <div id="result"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDisp = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        // GASのウェブアプリURLをここに貼り付け
        const GAS_URL = 'https://script.google.com/a/macros/mbs.co.jp/s/AKfycbwGUpvvvbJgPXwRk5hfiu70PBjhFvCscNhoX-I-oszP7tq5P5xL489E6Wn7_77IzkNb/exec';

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false; // 確定時のみ送信
        recognition.continuous = true;    // 連続認識

        recognition.onstart = () => {
            statusDisp.innerText = "認識中...";
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript !== '') {
                resultDiv.innerHTML += finalTranscript + '<br>';
                
                // GASへデータを送信
                sendToGas(finalTranscript);
            }
        };

        function sendToGas(text) {
    fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors', // これが重要
        cache: 'no-cache',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ text: text })
    })
    .then(() => {
        console.log("送信処理を実行しました");
    })
    .catch(err => {
        console.error("送信中にエラーが発生:", err);
    });
}
    </script>
</body>
</html>
