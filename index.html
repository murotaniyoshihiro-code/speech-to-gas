<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voice to Google Doc</title>
    <style>
        #status { color: red; font-weight: bold; }
        #result { border: 1px solid #ccc; padding: 10px; margin-top: 10px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>音声入力 → Googleドキュメント自動転送</h1>
    <button id="start-btn">録音開始</button>
    <button id="stop-btn">停止</button>
    <p>ステータス: <span id="status">待機中</span></p>
    <div id="result"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDisp = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        // GASのウェブアプリURL
        const GAS_URL = 'https://script.google.com/a/macros/mbs.co.jp/s/AKfycbz_9sGfz7LL5AYAJJNCPrQsumZfHhmwTqrP2HqeU8AquiQ-2lsGZuQTbpYYH_V6GkRG/exec';

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false; // 確定時のみ送信
        recognition.continuous = true;    // 連続認識

        // ★【追加】録音開始ボタンを押したときの処理
        startBtn.addEventListener('click', () => {
            try {
                recognition.start();
            } catch(e) {
                // すでに起動している場合のエラーを回避
                console.log("すでに起動しています", e);
            }
        });

        // ★【追加】停止ボタンを押したときの処理
        stopBtn.addEventListener('click', () => {
            recognition.stop();
            statusDisp.innerText = "停止中";
        });

        recognition.onstart = () => {
            statusDisp.innerText = "認識中...";
        };

        // ★【追加】予期せず録音が切れたときに自動で「待機中」に戻す処理
        recognition.onend = () => {
            if (statusDisp.innerText === "認識中...") {
                statusDisp.innerText = "待機中（終了しました）";
            }
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript !== '') {
                resultDiv.innerHTML += finalTranscript + '<br>';
                
                // GASへデータを送信
                sendToGas(finalTranscript);
            }
        };

        function sendToGas(text) {
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // これが重要
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            })
            .then(() => {
                console.log("送信処理を実行しました");
            })
            .catch(err => {
                console.error("送信中にエラーが発生:", err);
            });
        }
    </script>
</body>
</html>
